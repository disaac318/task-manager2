{% extends "base.html" %}
{% block content %}

<div class="container text-center py-3">
    <h1>StockManager</h1>
    <p>Your Smart Inventory</p>
</div>

<!-- {% for task in tasks %}
{{ task.task_name }}<br>
{{ task.category_name }}<br>
{{ task.task_description }}<br>
{{ task.is_urgent }}<br>
{{ task.due_date }}<br>
{% endfor %} -->

<div class="accordion"
    id="accordionExample">

    {% for task in tasks %}
    <!-- Accordion item -->
    <div class="accordion-item">
        <h2 class="accordion-header"
            id="heading{{ loop.index }}">
            <button class="accordion-button collapsed"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapse{{ loop.index }}"
                aria-expanded="false"
                aria-controls="collapse{{ loop.index }}">
                <strong>{{ task.task_name }}</strong> : {{ task.due_date }}&nbsp;&nbsp;
                {% if task.is_urgent == "on" %}
                <!-- Orange tooltip -->
                <i class="bi bi-exclamation-circle-fill text-warning"
                    data-bs-toggle="tooltip"
                    data-bs-placement="right"
                    data-bs-custom-class="tooltip-orange"
                    title="URGENT!"></i>
                {% endif %}

            </button>
        </h2>

        <div id="collapse{{ loop.index }}"
            class="accordion-collapse collapse"
            aria-labelledby="heading{{ loop.index }}"
            data-bs-parent="#accordionExample">
            <div class="accordion-body">
                <strong>{{ task.category_name }}</strong>
                <p>{{ task.task_description }}</p>
                <p class="text-muted">by: {{ task.created_by }}</p>
            </div>
        </div>
    </div>

    {% endfor %}

</div>

{% endblock %}
